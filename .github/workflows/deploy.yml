name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"   # daily; also keeps the raw-mirror cache from being evicted
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the raw mirror lives only in the Actions cache: each run restores the
      # newest one, updates it incrementally and saves it under a new key
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-prs-${{ github.run_id }}
          restore-keys: raw-prs-
      - run: ./scripts/update.sh
        env:
          # an optional personal token makes a cold-cache backfill much faster
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      - run: python3 scripts/stamp.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
